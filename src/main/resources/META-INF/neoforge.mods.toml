modLoader = "javafml"
loaderVersion = "[4,)"
license = "${license}"
issueTrackerURL = "https://github.com/dipilo/Leashable-Collars/issues"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${authors}"
logoFile = "assets/${id}/icon.png"
displayURL = "https://modrinth.com/mod/leashable-collars"
description = '''${description}'''

[[mixins]]
config = "playercollars.mixins.json"

[[mixins]]
config = "playercollars.leashplayers.mixins.json"

[[dependencies.${id}]]
modId = "neoforge"
type = "required"
versionRange = "${loader}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"

# Curios, not Accessories -- the accessory library differs per loader (plan section 0.5.1).
[[dependencies.${id}]]
modId = "curios"
type = "required"
versionRange = "[14.0.0,)"
ordering = "AFTER"
side = "BOTH"
