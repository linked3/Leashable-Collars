# NeoForge/Forge counterpart of playercollars.accesswidener. Same single widen: PawRenderer needs
# PlayerModel.slim to pick the slim-arm paw offsets. NeoForge access transformers use Mojang names,
# which is also what every node in this repo compiles against, so no translation is needed.
public net.minecraft.client.model.player.PlayerModel slim # slim
# Only the NeoForge side needs this one: AccessoryItemRenderUtil.transformToBottomFace reproduces an
# Accessories helper that reads a model part's cube extents, and Accessories reaches the private
# field through its own mixin. The Fabric nodes call that helper instead, so their access widener
# does not carry this.
public net.minecraft.client.model.geom.ModelPart cubes # cubes
