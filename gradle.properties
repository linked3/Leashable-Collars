# 3G was sized for building one node at a time. `chiseledCompile` compiles every declared node
# in parallel, and Loom/MDG each hold a Minecraft classpath in memory while they do it.
org.gradle.jvmargs=-Xmx8G
org.gradle.parallel=true
# Loom is not configuration-cache clean yet.
org.gradle.configuration-cache=false

# Mod identity, shared by every version node.
mod.id=playercollars
mod.name=Leashable Collars
mod.group=com.dipilodopilasaurus
mod.version=1.0.5
mod.license=MIT
mod.authors=Dipilodopilasaurus
mod.description=An unofficial port of jlortiz0's Leashable Collars.
